name: tests and development builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install optional codec for Linux tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd
      - run: python scripts/run_tests.py --json-out native-validation.json
      - run: node tests/gui_state.test.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: native-validation.json
          if-no-files-found: error
  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check source scripts tests archivist.py
      - run: ruff format --check source scripts tests archivist.py
      - run: python scripts/build_release.py --output dist
      - run: python scripts/check_release.py dist/*.zip dist/*.tar.gz --json-out packaging-validation.json
      - run: python -c 'import setuptools.build_meta as b; b.build_wheel("dist"); b.build_sdist("dist")'
      - run: python scripts/check_python_distribution.py --wheel dist/*.whl --sdist dist/archivist_archive-*.tar.gz --output python-distribution-check
      - uses: actions/upload-artifact@v7
        with:
          name: development-distributions
          path: |
            dist/
            packaging-validation.json
            python-distribution-check/qualification.json
          if-no-files-found: error

# Definitions are not qualification evidence until these jobs actually run.
# This workflow never publishes a package, tags a release or accesses tape hardware.
